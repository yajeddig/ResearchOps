name: Knowledge Base Site

# Publishes content/ and reports/ as a searchable MkDocs Material site on the
# gh-pages branch. One-time setup: Settings > Pages > Source = "Deploy from a
# branch", branch = gh-pages, folder = /(root).
on:
  push:
    branches: [main]
    paths: ['content/**', 'reports/**', 'research/**', 'mkdocs.yml', 'scripts/build_site.py', 'requirements-docs.txt', '.github/workflows/docs_site.yml']
  workflow_dispatch:

concurrency:
  group: docs-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements-docs.txt
      - run: python scripts/build_site.py
      - run: mkdocs build --strict
      - name: Deploy to gh-pages
        run: |
          git config user.name "ResearchOps Bot"
          git config user.email "bot@researchops.local"
          mkdocs gh-deploy --force --no-history
