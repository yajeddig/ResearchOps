name: CI

on:
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'config/**', 'requirements*.txt', 'pytest.ini', '.github/workflows/ci.yml']
  pull_request:
    paths: ['src/**', 'tests/**', 'config/**', 'requirements*.txt', 'pytest.ini', '.github/workflows/ci.yml']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
