name: WF1 - Daily Ingest

# `labeled` fires both when Make creates the issue with the label and when a
# label is added later. Listening to `opened` as well produced a duplicate run
# for every capture (one of the two was always cancelled).
on:
  issues:
    types: [labeled]

concurrency:
  group: wf1-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  ingest:
    if: |
      github.event.label.name == 'veille' &&
      (
        github.event.issue.author_association == 'OWNER' ||
        github.event.issue.author_association == 'COLLABORATOR' ||
        github.event.issue.author_association == 'MEMBER'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Process Input
        id: ingest
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python src/wf1_ingest.py

      - name: Close Issue
        if: always() && steps.ingest.outcome != 'cancelled'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          STATUS: ${{ steps.ingest.outputs.status }}
          MESSAGE: ${{ steps.ingest.outputs.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          case "$STATUS" in
            saved)     gh issue close "$ISSUE" --comment "✅ $MESSAGE" ;;
            duplicate) gh issue close "$ISSUE" --reason "not planned" --comment "♻️ $MESSAGE" ;;
            rejected)  gh issue close "$ISSUE" --reason "not planned" --comment "🚫 $MESSAGE" ;;
            rejected_pii) gh issue close "$ISSUE" --reason "not planned" --comment "🔒 $MESSAGE" ;;
            *)         gh issue comment "$ISSUE" --body "❌ WF1 a échoué (${STATUS:-unknown}). Logs : $RUN_URL" ;;
          esac
